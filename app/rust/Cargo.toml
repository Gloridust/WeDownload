[package]
name = "rust_lib_app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
flutter_rust_bridge = "=2.13.0"
url = "2.5.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
wd-core = { path = "../../crates/wd-core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
