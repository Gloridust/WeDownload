[package]
name = "wd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WeDownload core: link parsing, platform extractors, browser backend and downloader"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies", "json", "stream", "gzip", "brotli", "deflate", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "process"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
url = "2.5.8"
